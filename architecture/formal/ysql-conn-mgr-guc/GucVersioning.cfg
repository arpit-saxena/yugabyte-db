\* Default config: gradual / on_read, safety properties.
\* run-versioning.sh writes per-run copies with other STRATEGY / PROPAGATION
\* / bound values.
SPECIFICATION Spec
CONSTANTS
    NODES = {"n1", "n2"}
    CLIENTS = {"c1", "c2"}
    SPN = 2
    STRATEGY = "gradual"
    PROPAGATION = "on_read"
    TTL = "timed"
    AUTH = "passthrough"
    STALE_READS = FALSE
    MAXSTMTS = 3
    MAXSESS = 1
    MAXALTER = 2
    MAXSIGHUP = 1
INVARIANTS
    TypeOK
    P5
PROPERTIES
    P10
CHECK_DEADLOCK FALSE
